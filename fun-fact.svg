<svg xmlns="http://www.w3.org/2000/svg" width="700" height="130" viewBox="0 0 700 130" font-family="Consolas, 'Fira Code', 'Courier New', monospace" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
<clipPath id="c"><rect x="30" y="60" width="0" height="40"><animate attributeName="width" values="0;532;532;0" keyTimes="0;0.55;0.9;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
</defs>
<style>
.box{animation:fade 1s ease-out both}
.cur{animation:blink .8s steps(1) infinite}
