@keyframes blink{50%{opacity:0}}
</style>
<g class="box">
<rect x="2" y="2" width="696" height="126" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
<rect x="2" y="2" width="696" height="126" rx="14" fill="none" stroke="url(#g)" stroke-width="2" stroke-dasharray="80 30"><animate attributeName="stroke-dashoffset" from="0" to="-440" dur="5s" repeatCount="indefinite"/></rect>
<text x="30" y="44" font-size="15" font-weight="700" fill="url(#g)">// fun fact about me</text>
<g clip-path="url(#c)"><text x="30" y="86" font-size="15" fill="#e6edf3">"I believe every bug is an opportunity to learn something new."</text></g>
<rect class="cur" x="564" y="70" width="2" height="20" fill="#38bdf8"><animate attributeName="x" values="30;564;564;30" keyTimes="0;0.55;0.9;1" dur="9s" repeatCount="indefinite"/></rect>
</g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>