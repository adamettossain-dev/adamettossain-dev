<svg xmlns="http://www.w3.org/2000/svg" width="420" height="160" viewBox="0 0 420 160" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"><animate attributeName="stop-color" values="#34d399;#06b6d4;#34d399" dur="6s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#06b6d4"><animate attributeName="stop-color" values="#06b6d4;#34d399;#06b6d4" dur="6s" repeatCount="indefinite"/></stop></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient>
</defs>
<style>
.card{animation:rise .8s ease-out both}
.t{animation:fade .8s .2s ease-out both}
.d{animation:fade .8s .35s ease-out both}
.chip{animation:fade .6s ease-out both}
.btn{animation:pulse 2s ease-in-out infinite;transform-origin:332px 128px}
.bd{stroke-dasharray:60 20;animation:dash 4s linear infinite}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes dash{to{stroke-dashoffset:-320}}
</style>
<g class="card">
<rect x="2" y="2" width="416" height="156" rx="14" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>
<rect x="2" y="2" width="416" height="156" rx="14" fill="none" stroke="url(#g)" stroke-width="2" class="bd"/>
<rect x="24" y="24" width="6" height="26" rx="3" fill="url(#g)"/>
<text class="t" x="40" y="45" font-size="22" font-weight="700" fill="#f0f6fc">Spy Game</text>
<text class="d" x="24" y="76" font-size="14" fill="#8b949e">Browser game</text>
<g class="chip" style="animation-delay:0.5s"><rect x="24" y="96" width="50" height="24" rx="12" fill="#34d399" fill-opacity="0.15" stroke="#34d399" stroke-opacity="0.5"/><text x="49" y="112" text-anchor="middle" font-size="12" fill="#34d399">HTML</text></g>
<g class="chip" style="animation-delay:0.65s"><rect x="81.6" y="96" width="94" height="24" rx="12" fill="#34d399" fill-opacity="0.15" stroke="#34d399" stroke-opacity="0.5"/><text x="129" y="112" text-anchor="middle" font-size="12" fill="#34d399">JavaScript</text></g>
<g class="btn"><rect x="270" y="112" width="124" height="32" rx="16" fill="url(#g)"/><text x="332" y="133" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">Live demo  ↗</text></g>
</g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>