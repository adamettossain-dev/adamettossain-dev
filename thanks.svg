<svg xmlns="http://www.w3.org/2000/svg" width="700" height="110" viewBox="0 0 700 110" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#38bdf8"><animate attributeName="stop-color" values="#38bdf8;#8b5cf6;#f472b6;#38bdf8" dur="6s" repeatCount="indefinite"/></stop>
<stop offset="1" stop-color="#8b5cf6"><animate attributeName="stop-color" values="#8b5cf6;#f472b6;#38bdf8;#8b5cf6" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>
</defs>
<style>
.t{animation:pop 2.5s ease-in-out infinite;transform-origin:350px 55px}
.s{animation:fade 2.5s ease-in-out infinite}
.d{animation:float 3s ease-in-out infinite}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes fade{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
</style>
<circle class="d" cx="90" cy="40" r="5" fill="#38bdf8"/><circle class="d" cx="610" cy="70" r="6" fill="#f472b6" style="animation-delay:.6s"/>
<circle class="d" cx="140" cy="78" r="3" fill="#8b5cf6" style="animation-delay:1.2s"/><circle class="d" cx="560" cy="34" r="4" fill="#38bdf8" style="animation-delay:1.8s"/>
<text class="t" x="350" y="62" text-anchor="middle" font-size="34" font-weight="800" fill="url(#g)">Thanks for visiting my profile!</text>
<text class="s" x="350" y="92" text-anchor="middle" font-size="15" fill="#8b949e">Let's build something great together</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>